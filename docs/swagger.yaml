basePath: /api/v1
definitions:
  controller.APIResponse:
    properties:
      code:
        example: 0
        type: integer
      data: {}
      message:
        example: success
        type: string
      timestamp:
        example: 1780000000
        type: integer
    type: object
  controller.ChangeTaskStatusRequest:
    properties:
      status:
        allOf:
        - $ref: '#/definitions/model.TaskStatus'
        enum:
        - todo
        - in_progress
        - review
        - done
    required:
    - status
    type: object
  controller.CreateTaskRequest:
    properties:
      description:
        type: string
      due_date:
        type: string
      priority:
        allOf:
        - $ref: '#/definitions/model.TaskPriority'
        enum:
        - low
        - medium
        - high
        - none
      project_id:
        type: integer
      title:
        maxLength: 200
        type: string
    required:
    - project_id
    - title
    type: object
  controller.UpdateTaskRequest:
    properties:
      description:
        type: string
      due_date:
        type: string
      priority:
        allOf:
        - $ref: '#/definitions/model.TaskPriority'
        enum:
        - low
        - medium
        - high
        - none
      title:
        maxLength: 200
        type: string
    type: object
  controller.createCommentRequest:
    properties:
      content:
        maxLength: 2000
        minLength: 1
        type: string
    required:
    - content
    type: object
  dto.AssignTaskRequest:
    properties:
      assignee_id:
        type: integer
    required:
    - assignee_id
    type: object
  dto.ChangePasswordRequest:
    properties:
      new_password:
        maxLength: 72
        minLength: 8
        type: string
      old_password:
        maxLength: 20
        minLength: 6
        type: string
    required:
    - new_password
    - old_password
    type: object
  dto.UpdateProfileRequest:
    properties:
      bio:
        type: string
      username:
        type: string
    type: object
  model.TaskPriority:
    enum:
    - low
    - medium
    - high
    - none
    type: string
    x-enum-varnames:
    - TaskPriorityLow
    - TaskPriorityMedium
    - TaskPriorityHigh
    - TaskPriorityNone
  model.TaskStatus:
    enum:
    - todo
    - in_progress
    - review
    - done
    type: string
    x-enum-varnames:
    - TaskStatusTodo
    - TaskStatusInProgress
    - TaskStatusReview
    - TaskStatusDone
  request.AddProjectMemberRequest:
    properties:
      role:
        enum:
        - admin
        - member
        type: string
      user_id:
        type: integer
    required:
    - role
    - user_id
    type: object
  request.AddTeamMemberRequest:
    properties:
      role:
        enum:
        - admin
        - member
        type: string
      user_id:
        type: integer
    required:
    - role
    - user_id
    type: object
  request.CreateProjectRequest:
    properties:
      description:
        maxLength: 500
        type: string
      end_date:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      start_date:
        type: string
    required:
    - name
    type: object
  request.CreateTeamRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  request.LoginRequest:
    properties:
      password:
        maxLength: 72
        minLength: 8
        type: string
      username:
        maxLength: 20
        minLength: 4
        type: string
    required:
    - password
    - username
    type: object
  request.RegisterRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      username:
        maxLength: 20
        minLength: 4
        type: string
    required:
    - email
    - password
    - username
    type: object
  request.UpdateProjectRequest:
    properties:
      description:
        maxLength: 500
        type: string
      end_date:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      start_date:
        type: string
      status:
        enum:
        - active
        - archived
        type: string
    type: object
  request.UpdateTeamRequest:
    properties:
      avatar:
        maxLength: 500
        type: string
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    type: object
