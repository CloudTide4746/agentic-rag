# 本地开发配置；env_file 路径相对本文件。密码、JWT 和内部令牌保留在 .env。
# 优先级：进程环境变量 > 本文件 > .env。
env_file: .env

server:
  addr: "127.0.0.1:7800"
  gin_mode: debug

database:
  # 复用 .env DSN 的账号、密码、地址，仅替换库名，隔离 Python Agent 数据。
  # 显式设置进程 DATABASE_DSN 时使用其完整 DSN，不应用这里的库名覆盖。
  name: agentic_rag_dev

# 其余字段读取 .env，也可在本文件设置非敏感配置，例如：
# redis:
#   addr: "127.0.0.1:6379"
#   db: 0
# agent:
#   base_url: "http://127.0.0.1:8000"
# 敏感字段：database.dsn、redis.password、jwt.secret、agent.internal_api_token。
