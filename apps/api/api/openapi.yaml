openapi: 3.1.0
info:
  title: Agentic RAG Platform API
  version: 1.0.0
  description: Go public API for authentication and TeamFlow core CRUD.
servers:
  - url: /
    description: Same-origin Go API
tags:
  - name: Auth
    description: User registration and authentication.
  - name: Teams
    description: Team resource CRUD.
  - name: Projects
    description: Project resource CRUD.
  - name: Tasks
    description: Task resource CRUD.
  - name: Chat
    description: >-
      Platform chat sessions. Go owns the platform mapping, authorization and
      lifecycle; the Python Agent runtime owns conversation content and is only
      reached through the internal AgentClient.
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      security: []
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      security: []
      summary: Log in and issue an access token
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated user and bearer token
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/LoginResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/teams:
    get:
      tags: [Teams]
      operationId: listTeams
      security: [{BearerAuth: []}]
      summary: List teams for the authenticated user
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Paginated teams
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/TeamPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Teams]
      operationId: createTeam
      security: [{BearerAuth: []}]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTeamRequest'}
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          team: {$ref: '#/components/schemas/Team'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/teams/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      tags: [Teams]
      operationId: getTeam
      security: [{BearerAuth: []}]
      summary: Get a team
      responses:
        '200':
          description: Team detail
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          team: {$ref: '#/components/schemas/Team'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Teams]
      operationId: updateTeam
      security: [{BearerAuth: []}]
      summary: Update a team
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTeamRequest'}
      responses:
        '200':
          description: Updated team
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          team: {$ref: '#/components/schemas/Team'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Teams]
      operationId: deleteTeam
      security: [{BearerAuth: []}]
      summary: Delete a team
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/teams/{id}/projects:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      tags: [Projects]
      operationId: listTeamProjects
      security: [{BearerAuth: []}]
      summary: List projects in a team
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Paginated projects
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/ProjectPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Projects]
      operationId: createProject
      security: [{BearerAuth: []}]
      summary: Create a project in a team
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProjectRequest'}
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          project: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/projects/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      tags: [Projects]
      operationId: getProject
      security: [{BearerAuth: []}]
      summary: Get a project
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          project: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Projects]
      operationId: updateProject
      security: [{BearerAuth: []}]
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProjectRequest'}
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          project: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Projects]
      operationId: deleteProject
      security: [{BearerAuth: []}]
      summary: Delete a project
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      security: [{BearerAuth: []}]
      summary: List tasks in a project
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string, pattern: '^[1-9][0-9]*$'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Paginated tasks
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/TaskPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Tasks]
      operationId: createTask
      security: [{BearerAuth: []}]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTaskRequest'}
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          task: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/tasks/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      tags: [Tasks]
      operationId: getTask
      security: [{BearerAuth: []}]
      summary: Get a task
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskResponseEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Tasks]
      operationId: updateTask
      security: [{BearerAuth: []}]
      summary: Update a task
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTaskRequest'}
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskResponseEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Tasks]
      operationId: deleteTask
      security: [{BearerAuth: []}]
      summary: Delete a task
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/chat/sessions:
    get:
      tags: [Chat]
      operationId: listChatSessions
      security: [{BearerAuth: []}]
      summary: List the caller's chat sessions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': {$ref: '#/components/responses/ChatSessionPageResponseEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Chat]
      operationId: createChatSession
      security: [{BearerAuth: []}]
      summary: Create a chat session
      description: >-
        Creates the platform mapping first, then the Agent session. An explicit
        Agent rejection marks the mapping failed; a timeout or lost response
        marks it pending for reconciliation and is never retried blindly.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string, maxLength: 128}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {$ref: '#/components/responses/AgentRejected'}
        '503': {$ref: '#/components/responses/AgentUnavailable'}
        '504': {$ref: '#/components/responses/AgentTimeout'}
  /api/v1/chat/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/ChatSessionID'
    get:
      tags: [Chat]
      operationId: getChatSession
      security: [{BearerAuth: []}]
      summary: Get one owned chat session with its message history
      responses:
        '200': {$ref: '#/components/responses/ChatSessionDetailResponseEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/AgentUnavailable'}
  /api/v1/chat/sessions/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ChatSessionID'
    get:
      tags: [Chat]
      operationId: getChatMessages
      security: [{BearerAuth: []}]
      summary: List the messages of one owned chat session
      responses:
        '200': {$ref: '#/components/responses/ChatMessageListResponseEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/AgentUnavailable'}
  /api/v1/chat/sessions/{id}/runs:
    parameters:
      - $ref: '#/components/parameters/ChatSessionID'
    post:
      tags: [Chat]
      operationId: startChatRun
      security: [{BearerAuth: []}]
      summary: Ask a question and stream the Agent answer
      description: >-
        Proxies the Agent's server-sent event stream. Event data is produced by
        the Agent runtime. Validation, ownership and knowledge base checks run
        before the stream opens, so a rejected request never emits a partial
        stream. Whether the user turn is persisted is decided by the platform,
        not by the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: {type: string, minLength: 1, maxLength: 4000}
                knowledge_base_ids:
                  type: array
                  maxItems: 50
                  items: {type: string, pattern: '^[1-9][0-9]*$'}
                images:
                  type: array
                  maxItems: 4
                  items: {type: string}
      responses:
        '200':
          description: Agent event stream
          content:
            text/event-stream:
              schema: {type: string, description: 'SSE frames (event/data fields)'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {$ref: '#/components/responses/AgentRejected'}
        '503': {$ref: '#/components/responses/AgentUnavailable'}
        '504': {$ref: '#/components/responses/AgentTimeout'}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, maximum: 100000, default: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    ChatSessionID:
      name: id
      in: path
      required: true
      description: >-
        The opaque platform session id. The Agent's internal numeric session id
        is never exposed.
      schema: {type: string, minLength: 1, maxLength: 64}
  responses:
    Success:
      description: Successful operation; the data field contains the route response.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SuccessEnvelope'}
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Unauthorized:
      description: Missing, expired, invalid, or superseded token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Forbidden:
      description: Authenticated user is not allowed to access the resource
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Conflict:
      description: Duplicate resource or concurrent update conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ChatSessionResponseEnvelope:
      description: Successful operation; the data field contains the chat session.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ChatSessionResponseEnvelope'}
    ChatSessionPageResponseEnvelope:
      description: Successful operation; the data field contains a session page.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ChatSessionPageResponseEnvelope'}
    ChatSessionDetailResponseEnvelope:
      description: Successful operation; the data field contains a session and its messages.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ChatSessionDetailResponseEnvelope'}
    ChatMessageListResponseEnvelope:
      description: Successful operation; the data field contains the message list.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ChatMessageListResponseEnvelope'}
    AgentRejected:
      description: The Agent runtime explicitly rejected the request (code AGENT_REJECTED)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    AgentUnavailable:
      description: The Agent runtime is unreachable or failed internally (code AGENT_UNAVAILABLE)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    AgentTimeout:
      description: The Agent runtime did not respond in time (code AGENT_TIMEOUT)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    SuccessEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data: {}
        request_id: {type: string}
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
        request_id: {type: string}
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: {type: string, minLength: 2, maxLength: 50}
        email: {type: string, format: email, maxLength: 100}
        password: {type: string, minLength: 8, maxLength: 72}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string, writeOnly: true}
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: {type: string}
        user: {$ref: '#/components/schemas/User'}
    User:
      type: object
      required: [id, username, email, nickname, avatar, created_at]
      properties:
        id: {type: string}
        username: {type: string}
        email: {type: string, format: email}
        nickname: {type: string}
        avatar: {type: string}
        created_at: {type: string, format: date-time}
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 2, maxLength: 100}
        description: {type: string, maxLength: 500}
    UpdateTeamRequest:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 2, maxLength: 100}
        description: {type: string, maxLength: 500}
        avatar: {type: string, maxLength: 500}
    Team:
      type: object
      required: [id, name, description, owner_id, avatar, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        owner_id: {type: string}
        avatar: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TeamPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Team'}}
        total: {type: integer, format: int64}
        page: {type: integer}
        page_size: {type: integer}
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 2, maxLength: 100}
        description: {type: string, maxLength: 500}
        start_date: {type: string, format: date-time}
        end_date: {type: string, format: date-time}
    UpdateProjectRequest:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 2, maxLength: 100}
        description: {type: string, maxLength: 500}
        status: {type: string, enum: [active, archived]}
        start_date: {type: string, format: date-time}
        end_date: {type: string, format: date-time}
    Project:
      type: object
      required: [id, name, description, team_id, owner_id, status, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        team_id: {type: string}
        owner_id: {type: string}
        status: {type: string, enum: [active, archived]}
        start_date: {type: [string, 'null'], format: date-time}
        end_date: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProjectPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Project'}}
        total: {type: integer, format: int64}
        page: {type: integer}
        page_size: {type: integer}
    CreateTaskRequest:
      type: object
      required: [project_id, title]
      properties:
        project_id: {type: string, pattern: '^[1-9][0-9]*$'}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 10000}
        priority: {type: string, enum: [low, medium, high, none], default: medium}
        due_date: {type: string, format: date-time}
    UpdateTaskRequest:
      type: object
      required: [version]
      minProperties: 2
      properties:
        version: {type: integer, minimum: 0}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 10000}
        priority: {type: string, enum: [low, medium, high, none]}
        due_date: {type: string, format: date-time}
    Task:
      type: object
      required: [id, title, description, project_id, creator_id, status, priority, version, created_at, updated_at]
      properties:
        id: {type: string}
        title: {type: string}
        description: {type: string}
        project_id: {type: string}
        assignee_id: {type: [string, 'null']}
        creator_id: {type: string}
        status: {type: string, enum: [todo, in_progress, review, done]}
        priority: {type: string, enum: [low, medium, high, none]}
        due_date: {type: [string, 'null'], format: date-time}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TaskPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Task'}}
        total: {type: integer, format: int64}
        page: {type: integer}
        page_size: {type: integer}
    TaskResponseEnvelope:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data:
              type: object
              required: [task]
              properties:
                task: {$ref: '#/components/schemas/Task'}
    ChatSession:
      type: object
      required: [id, title, status, created_at, updated_at]
      properties:
        id:
          type: string
          description: Opaque platform session id.
        title: {type: string}
        status:
          type: string
          enum: [creating, active, pending, failed, deleting]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ChatMessage:
      type: object
      required: [role, content, created_at]
      properties:
        role: {type: string, enum: [user, assistant]}
        content: {type: string}
        citations:
          type: [array, 'null']
          description: Structured citations produced by the Agent runtime.
          items: {type: object, additionalProperties: true}
        images:
          type: array
          items: {type: string}
        decision_log_id:
          type: [string, 'null']
          description: Opaque decision log reference for this answer.
        created_at: {type: string, format: date-time}
    ChatSessionPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ChatSession'}}
        total: {type: integer, format: int64}
        page: {type: integer}
        page_size: {type: integer}
    ChatSessionResponseEnvelope:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data:
              type: object
              required: [session]
              properties:
                session: {$ref: '#/components/schemas/ChatSession'}
    ChatSessionPageResponseEnvelope:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ChatSessionPage'}
    ChatSessionDetailResponseEnvelope:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data:
              type: object
              required: [session, messages]
              properties:
                session: {$ref: '#/components/schemas/ChatSession'}
                messages: {type: array, items: {$ref: '#/components/schemas/ChatMessage'}}
    ChatMessageListResponseEnvelope:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/ChatMessage'}}
