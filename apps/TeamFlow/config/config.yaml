# 应用配置
app:
  name: TeamFlow
  env: development  # development, production
  port: 8080
  version: 1.0.0

# 数据库配置s
database:
  host: localhost
  port: 3306
  user: root
  password: ${DB_PASSWORD}
  dbname: teamflow
  charset: utf8mb4
  parseTime: true
  loc: Local
  maxIdleConns: 10      # 最大空闲连接数
  maxOpenConns: 100     # 最大打开连接数
  connMaxLifetime:  3600000000000 # 连接最大生存时间（1小时,纳秒）

# Redis 配置
redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  poolSize: 10
  minIdleConns: 5

# JWT 配置
jwt:
  secret: ${JWT_SECRET}
  expireHours: 24

# 日志配置
log:
  level: debug          # debug, info, warn, error
  format: json          # json, console
  filename: storage/logs/app.log
  maxSize: 100          # 单个日志文件最大大小（MB）
  maxBackups: 30        # 保留旧日志文件的最大个数
  maxAge: 7             # 保留旧日志文件的最大天数
  compress: true        # 是否压缩旧日志

# 文件上传配置
upload:
  maxSize: 10           # 最大上传大小（MB）
  allowTypes:           # 允许的文件类型
    - jpg
    - jpeg
    - png
    - gif
    - pdf
  savePath: storage/uploads
